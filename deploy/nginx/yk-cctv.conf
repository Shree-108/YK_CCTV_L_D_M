# Yatrikart CCTV - ONE Nginx reverse proxy for both apps on the EC2 server.
#
#   Public URL   ->  application                    (all four apps listen on 127.0.0.1 only)
#   /            ->  UDM frontend   127.0.0.1:3010
#   /api/        ->  UDM backend    127.0.0.1:8010
#   /ldm/        ->  LDM frontend   127.0.0.1:3000   (Next.js basePath /ldm: the prefix is passed on)
#   /ldm-api/    ->  LDM backend    127.0.0.1:8000   (prefix removed: /ldm-api/api/health -> /api/health)
#
# Install (Ubuntu 24.04):
#   sudo cp deploy/nginx/yk-cctv.conf /etc/nginx/sites-available/yk-cctv
#   sudo ln -sf /etc/nginx/sites-available/yk-cctv /etc/nginx/sites-enabled/yk-cctv
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Security group: open 80 (and 443 once HTTPS is added) to the internet; 22 to your own IP only. Never open
# 3000, 3010, 8000 or 8010. If the UDM site already has its own Nginx file, merge the LDM blocks into it instead -
# there must be only one server block for port 80.

# Extra brake on password guessing in front of the app's own lock-out (5 failures -> 15 min, per user and per IP)
limit_req_zone $binary_remote_addr zone=ldm_login:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # LDM video uploads are capped at MAX_VIDEO_UPLOAD_MB (500) by the API itself
    client_max_body_size 600m;

    # Same headers for every app: the real host (the API checks the browser Origin against it), scheme and client IP
    # (uvicorn trusts these from 127.0.0.1 only, so the login rate limit sees the real visitor address).
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;     # host AND port as the browser sent them (the Origin check compares both)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ------------------------------------------------------------------ LDM
    location = /ldm-api/api/auth/login {
        limit_req zone=ldm_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/api/auth/login;
    }

    location /ldm-api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_buffering off;              # live event stream (SSE) and MJPEG camera streams
        proxy_request_buffering off;      # large video uploads stream straight to the API
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ldm {
        proxy_pass http://127.0.0.1:3000;
    }

    # ------------------------------------------------------------------ UDM
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
    }
}
